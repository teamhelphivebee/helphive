<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Email Confirmed — HelpHive</title>
<meta name="description" content="Where HelpHive account confirmation links land.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EC;
    --bg-panel: #F2EBD9;
    --gold: #B08A2E;
    --gold-deep: #96751F;
    --ink: #2A2410;
    --text: #3A3320;
    --text-dim: #7A7050;
    --rule: #E2D8BC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    line-height: 1.7;
  }

  header.site {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 20px 32px;
    border-bottom: 1px solid var(--rule);
  }

  header.site a.brand {
    color: var(--gold);
    text-decoration: none;
    font-family: "Playfair Display", serif;
    font-weight: 500;
    font-size: 1.25rem;
    letter-spacing: 0.01em;
  }
  header.site a.brand b { font-weight: 700; color: var(--gold-deep); }

  header.site a.back {
    color: var(--gold-deep);
    text-decoration: none;
    font-size: 0.9rem;
  }
  header.site a.back:hover { text-decoration: underline; }

  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  .eyebrow {
    color: var(--gold-deep);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    font-weight: 600;
    margin-bottom: 14px;
  }

  h1 {
    font-family: "Playfair Display", serif;
    font-weight: 600;
    color: var(--ink);
    font-size: clamp(2rem, 4vw, 2.6rem);
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .intro {
    font-size: 1.05rem;
    color: var(--text);
    padding: 20px 24px;
    background: var(--bg-panel);
    border-left: 3px solid var(--gold-deep);
    border-radius: 4px;
    margin: 24px 0 32px;
  }

  p { margin: 0 0 14px; color: var(--text); }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 24px;
    margin: 24px 0;
  }

  .next {
    color: var(--text-dim);
    font-size: 0.95rem;
  }

  .error-text {
    color: #96311F;
    font-size: 0.92rem;
    margin-top: 0.9rem;
  }
  .error-text a { color: var(--gold-deep); }

  footer.site {
    border-top: 1px solid var(--rule);
    padding: 28px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  footer.site a { color: var(--gold-deep); margin: 0 8px; text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="/">Help<b>Hive</b></a>
  <a class="back" href="/">&larr; Back to helphiveco.com</a>
</header>

<main id="app">
  <div class="eyebrow">Account</div>
  <!-- Rendered by script below. The no-JS copy is the common case (a fresh
       signup confirmation), because Supabase has already done the verifying
       server-side by the time the browser lands here — this page only reports
       the outcome. -->
  <h1>Email confirmed</h1>
  <div class="intro">Your email address is confirmed. Open the HelpHive app and
    sign in to keep going.</div>
  <p class="next">You can close this tab.</p>
</main>

<footer class="site">
  Help<b>Hive</b> &middot; Boca Raton, FL
  <br>
  <a href="/">Home</a> &middot; <a href="/privacy-policy.html">Privacy Policy</a>
</footer>

<script>
  // Supabase lands here after /auth/v1/verify. Success arrives as tokens in the
  // URL *fragment* (#access_token=…&type=signup); failures arrive as either
  // ?error=… or #error=… depending on where GoTrue gave up. Read both.
  const app = document.getElementById('app');
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const query = new URLSearchParams(location.search);
  const param = (name) => hash.get(name) || query.get(name);

  const error = param('error') || param('error_code');
  const description = param('error_description');
  const type = param('type');

  const render = (heading, intro, extra) => {
    app.innerHTML =
      '<div class="eyebrow">Account</div>' +
      '<h1></h1><div class="intro"></div>' +
      (extra ? '<div class="panel"><p class="next"></p></div>' : '');
    app.querySelector('h1').textContent = heading;
    app.querySelector('.intro').textContent = intro;
    if (extra) app.querySelector('.panel .next').textContent = extra;
  };

  if (error) {
    // Expired links are by far the most common failure — GoTrue's default
    // confirmation window is 24 hours.
    render(
      'This link didn’t work',
      description ? decodeURIComponent(description.replace(/\+/g, ' '))
                  : 'The link has expired or was already used.',
      'Open the HelpHive app and ask for a new email, then use the most recent one — older links stop working once a new one is sent.'
    );
  } else if (type === 'recovery') {
    // Password reset can't finish in the browser yet: the recovery token has
    // nowhere to go without an app deep link. Say so plainly rather than
    // claiming success the user won't get.
    render(
      'Reset link verified',
      'We confirmed it’s you, but finishing a password reset in the browser isn’t supported yet.',
      'Email support@helphiveco.com and we’ll reset the password on your account directly.'
    );
  } else if (type === 'email_change') {
    render(
      'Email address updated',
      'Your new email address is confirmed. Sign in to the HelpHive app with it from now on.',
      'You can close this tab.'
    );
  }

  // Drop the tokens out of the address bar so they don't sit in history or leak
  // through a Referer header. The page never needs them; verification already
  // happened server-side.
  if (location.hash || location.search) {
    history.replaceState(null, '', location.pathname);
  }
</script>

</body>
</html>
